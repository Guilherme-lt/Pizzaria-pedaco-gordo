<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Big Fat Slice</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
  </head>
  <body>
    <!--TOPO DO SITE-->
    <header>
      <div class="cabecalho">
        <a href="index.html">
          <img
            class="textopizzaria"
            src="imagens/logos/big fat slice readonly.png"
            alt="Logo da Pizzaria"
          />
        </a>
        <nav>
          <a href="index.html">Home</a>
          <a href="menu.html">Menu</a>
        </nav>
      </div>
    </header>

    <!--BODY DO SITE-->
    <main>
      <!-- Parte mais importante do site -->
      <section>
        <div>
          <h2 class="depoisbemvindo">Uma fatia nunca é suficiente!</h2>
        </div>
        <div class="primeiradiv">
          <h2 class="dentrodiv">Peça sua pizza pelo site</h2>
          <img
            class="propagandadiv1"
            src="imagens/logos/propaganda div1.png"
            alt="Propaganda 1"
          />
          <img
            class="propagandadiv2"
            src="imagens/logos/propaganda div2.png"
            alt="Propaganda 2"
          />

      </section>
      <section>
        <img
          class="logopizzaria"
          src="imagens/logos/logo da pizzaria.png"
          alt="Logo da Pizzaria"
        />
      </section>
    </main>

    <!--RODAPÉ DO SITE-->
    <footer>
      <div class="rodape">
        <img
          src="imagens/logos/logo branca da pizzaria.png"
          width="200px"
          alt="Logo branca da pizzaria"
        />
        <fieldset>
          <legend>
            <h3>Sobre Nós</h3>

          <h4>Somos uma empresa que preza pelo empresa que nós empresa.</h4>
        </fieldset>
